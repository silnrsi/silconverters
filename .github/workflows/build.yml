# Build silconverters and run tests

name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required by sillsdev/codesign/trusted-signing-action (OIDC to Azure)

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "./SEC VS2019.sln"

jobs:
  build-windows:
    runs-on: [windows-2022]

    strategy:
      # Keep building other jobs even if another fails, to show what is still working.
      fail-fast: false
      matrix:
        build_configuration: ["Debug", "Release"]
        build_platform: ['x64', 'x86']

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # Install ATL/MFC (for windows-2022, this is v143)
    - name: Install Visual Studio ATL/MFC components
      shell: powershell
      run: |
        Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
        $vsInstallPath = & .\vswhere.exe -latest -products * -property installationPath

        $components = @(
          "--add Microsoft.VisualStudio.Component.VC.ATL",
          "--add Microsoft.VisualStudio.Component.VC.MFC"
        ) -join ' '

        $args = @(
          "modify",
          "--installPath `"$vsInstallPath`"",
          $components,
          "--quiet",
          "--norestart",
          "--nocache"
        )

        Start-Process -FilePath .\vs_installer.exe -ArgumentList $args -Wait -NoNewWindow

    # Locate MSBuild (no Node dependency)
    - name: Locate MSBuild
      id: msbuild
      shell: powershell
      run: |
        $path = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe

        echo "MSBUILD_PATH=$path" >> $env:GITHUB_ENV

    # Setup NuGet
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore NuGet
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        "${{env.SOLUTION_FILE_PATH}}"
        /t:Restore
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}

    - name: Build
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        /m
        /bl:build-${{matrix.build_platform}}-${{matrix.build_configuration}}.binlog
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}
        "${{env.SOLUTION_FILE_PATH}}"

    - name: Upload build logs
      uses: actions/upload-artifact@v6
      with:
        name: logs-${{ matrix.build_platform }}-${{ matrix.build_configuration }}
        path: build-*.binlog

    # The Installer\*.wixproj merge modules harvest this repo's own exes/dlls straight out of
    # output\<platform>\<configuration>\ (see e.g. DChartHelperMM's Source="..\..\output\x64\
    # release\DChartHelper.exe") and were already built - unsigned - by the single solution Build
    # above. Sign that output now, then force the merge modules (and the MSI/bundle that harvest
    # them in turn) to rebuild so they pick up the now-signed bytes.
    - name: Sign build outputs
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      uses: sillsdev/codesign/trusted-signing-action@v3
      with:
        credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
        files-folder: output\${{ matrix.build_platform }}\${{ matrix.build_configuration }}
        files-folder-filter: "dll,exe"

    # Clear the wix projects' own bind cache/output so the rebuild below can't decide they're
    # already up to date - the safest guarantee is to force it, rather than trust that WiX's own
    # bind-input tracking picks up the now-newer Source= binaries. Only descend into obj\<platform>\
    # <configuration>\ (the wix bind intermediate/tracking output) and bin\ - never obj\ itself,
    # which is also where these SDK-style wixprojs' NuGet restore assets (project.assets.json etc.)
    # live; deleting those would reintroduce the NETSDK1047 restore failures fixed earlier. The
    # app/library projects are left alone: their compiled output is untouched by signing except
    # for its timestamp, which the normal incremental build already treats as up to date against
    # their (unchanged) sources.
    - name: Clear installer project outputs
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: powershell
      run: |
        $objDirs = Get-ChildItem -Path Installer -Directory -Recurse -Filter obj
        foreach ($dir in $objDirs) {
          Get-ChildItem $dir.FullName -Directory | Remove-Item -Recurse -Force
        }
        Get-ChildItem -Path Installer -Directory -Recurse -Filter bin |
          Remove-Item -Recurse -Force

    - name: Rebuild installer projects with signed binaries
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        /m
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}
        "${{env.SOLUTION_FILE_PATH}}"

    # Burn bundles (SetupSILConverters*.exe) carry an attached container - the vc_redist/MSI
    # payloads - appended after the engine stub at build time, with byte offsets recorded in the
    # engine's own manifest. Authenticode-signing the finished bundle exe directly changes the
    # engine's size without updating those offsets, so Burn can no longer find/extract the
    # container at install time ("Failed to acquire container: WixAttachedContainer", surfacing as
    # a "locate missing file" dialog and an 0x800704c7 abort). The fix is the same detach/sign/
    # reattach/sign dance the (legacy) TeamCity build already does for this exact reason - see
    # build/buildBaseInstaller.bat's "UseInsignia" branch, which calls insignia -ib/-ab around the
    # sign - just using the modern `wix burn detach`/`reattach` subcommands instead of insignia.exe.
    - name: Install WiX signing tool
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd
      run: |
        dotnet tool install --global wix --version 6.0.2
        echo %USERPROFILE%\.dotnet\tools>> %GITHUB_PATH%

    - name: Detach bundle engine for signing
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd
      run: >
        for %%f in ("output\${{matrix.build_platform}}\SetupSILConverters*.exe")
        do wix burn detach "%%f" -engine "output\${{matrix.build_platform}}\engine.exe"

    - name: Sign bundle engine
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      uses: sillsdev/codesign/trusted-signing-action@v3
      with:
        credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
        files-folder: output/${{ matrix.build_platform }}
        files-folder-filter: engine.exe

    - name: Reattach signed engine to bundle
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd
      run: |
        for %%f in ("output\${{matrix.build_platform}}\SetupSILConverters*.exe") do wix burn reattach "%%f" -engine "output\${{matrix.build_platform}}\engine.exe" -o "%%f"
        del "output\${{matrix.build_platform}}\engine.exe"

    - name: Sign installer
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      uses: sillsdev/codesign/trusted-signing-action@v3
      with:
        credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
        files-folder: output/${{ matrix.build_platform }}
        files-folder-filter: SetupSILConverters*.exe

    - name: Upload installer artifact
      if: ${{ matrix.build_configuration == 'Release' }}
      uses: actions/upload-artifact@v6
      with:
        name: silconverters-installer-${{ matrix.build_platform }}
        if-no-files-found: error
        path: output/${{ matrix.build_platform }}/SetupSILConverters*.exe
