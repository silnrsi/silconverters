# Build silconverters and run tests

name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required by sillsdev/codesign/trusted-signing-action (OIDC to Azure)

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: "./SEC VS2019.sln"

jobs:
  build-windows:
    runs-on: [windows-2022]

    strategy:
      # Keep building other jobs even if another fails, to show what is still working.
      fail-fast: false
      matrix:
        build_configuration: ["Debug", "Release"]
        build_platform: ['x64', 'x86']

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # Install ATL/MFC (for windows-2022, this is v143)
    - name: Install Visual Studio ATL/MFC components
      shell: powershell
      run: |
        Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
        $vsInstallPath = & .\vswhere.exe -latest -products * -property installationPath

        $components = @(
          "--add Microsoft.VisualStudio.Component.VC.ATL",
          "--add Microsoft.VisualStudio.Component.VC.MFC"
        ) -join ' '

        $args = @(
          "modify",
          "--installPath `"$vsInstallPath`"",
          $components,
          "--quiet",
          "--norestart",
          "--nocache"
        )

        Start-Process -FilePath .\vs_installer.exe -ArgumentList $args -Wait -NoNewWindow

    # Locate MSBuild (no Node dependency)
    - name: Locate MSBuild
      id: msbuild
      shell: powershell
      run: |
        $path = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -products * -requires Microsoft.Component.MSBuild `
          -find MSBuild\**\Bin\MSBuild.exe

        echo "MSBUILD_PATH=$path" >> $env:GITHUB_ENV

    # Setup NuGet
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4

    # Cache NuGet packages
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore NuGet
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        "${{env.SOLUTION_FILE_PATH}}"
        /t:Restore
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}

    # Encoding-Converters-Core's dependencies come from the SharedItems.props inside the ec-core package
    # itself (see Directory.Build.targets), which only exists once the first restore has pulled ec-core
    # into the NuGet cache - so restore again to pick up those PackageReferences.
    - name: Restore NuGet (EC-core SharedItems.props dependencies)
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        "${{env.SOLUTION_FILE_PATH}}"
        /t:Restore
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}

    - name: Build
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        /m
        /bl:build-${{matrix.build_platform}}-${{matrix.build_configuration}}.binlog
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}
        "${{env.SOLUTION_FILE_PATH}}"

    - name: Upload build logs
      uses: actions/upload-artifact@v6
      with:
        name: logs-${{ matrix.build_platform }}-${{ matrix.build_configuration }}
        path: build-*.binlog

    # The Installer\*.wixproj merge modules harvest this repo's own exes/dlls straight out of
    # output\<platform>\<configuration>\ (see e.g. DChartHelperMM's Source="..\..\output\x64\
    # release\DChartHelper.exe") and were already built - unsigned - by the single solution Build
    # above. Sign that output now, then force the merge modules (and the MSI/bundle that harvest
    # them in turn) to rebuild so they pick up the now-signed bytes. Only files that aren't already
    # validly signed are signed: the Encoding-Converters-Core files copied in here arrive signed by
    # SIL, and third-party ones (Microsoft, Google, ...) keep their own vendor's signature.
    - name: Collect unsigned build outputs
      id: unsigned
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      # pwsh, not powershell: Windows PowerShell 5's utf8 Out-File writes a BOM into GITHUB_OUTPUT
      shell: pwsh
      run: |
        $dir = "output\${{ matrix.build_platform }}\${{ matrix.build_configuration }}"
        if (-not (Test-Path $dir)) { throw "$dir does not exist" }
        $files = Get-ChildItem $dir -File | Where-Object { $_.Extension -in '.dll','.exe' } |
          Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' } |
          ForEach-Object { $_.FullName }
        Write-Host "Unsigned files to sign: $(@($files).Count)"
        $files | ForEach-Object { Write-Host "  $_" }
        "count=$(@($files).Count)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        "files<<EOF_FILE_LIST" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        $files | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        "EOF_FILE_LIST" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Sign build outputs
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' && steps.unsigned.outputs.count != '0' }}
      uses: sillsdev/codesign/trusted-signing-action@v3
      with:
        credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
        files: ${{ steps.unsigned.outputs.files }}

    # Clear the wix projects' own bind cache/output so the rebuild below can't decide they're
    # already up to date - the safest guarantee is to force it, rather than trust that WiX's own
    # bind-input tracking picks up the now-newer Source= binaries. Only descend into obj\<platform>\
    # <configuration>\ (the wix bind intermediate/tracking output) and bin\ - never obj\ itself,
    # which is also where these SDK-style wixprojs' NuGet restore assets (project.assets.json etc.)
    # live; deleting those would reintroduce the NETSDK1047 restore failures fixed earlier.
    - name: Clear installer project outputs
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: powershell
      run: |
        $objDirs = Get-ChildItem -Path Installer -Directory -Recurse -Filter obj
        foreach ($dir in $objDirs) {
          Get-ChildItem $dir.FullName -Directory | Remove-Item -Recurse -Force
        }
        Get-ChildItem -Path Installer -Directory -Recurse -Filter bin |
          Remove-Item -Recurse -Force

    # Rebuild ONLY the .wixproj projects - never the whole solution. Rebuilding the solution re-runs
    # every C#/VB project's copy-to-output step, which sees that the signed exe/dll in output\ no
    # longer matches obj\ (different size/timestamp) and copies the unsigned obj\ build back over it,
    # silently undoing the signing above before the merge modules harvest it (which is how
    # AdaptIt2Unicode.exe, SFMConv.exe, etc. shipped unsigned). Everything this needs is read from
    # the .sln so it can't drift from it: which wixprojs build for this solution platform (and with
    # what project platform), and their build order (the sln's ProjectDependencies between wixprojs:
    # merge modules -> SEC Setup* MSIs -> SetupSILConverters bundle). SolutionDir is passed because
    # SEC Setup*'s CopyMsiToOutput target uses it, and it's only set automatically by a .sln build.
    - name: Rebuild installer projects with signed binaries
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: powershell
      run: |
        $sln = Get-Content "${{ env.SOLUTION_FILE_PATH }}" -Raw
        $solutionCfg = "${{ matrix.build_configuration }}|${{ matrix.build_platform }}"
        $wix = @{}
        foreach ($m in [regex]::Matches($sln, '(?s)Project\("\{[^}]+\}"\) = "[^"]+", "([^"]+\.wixproj)", "\{([0-9A-Fa-f-]+)\}"(.*?)\r?\nEndProject')) {
          $guid = $m.Groups[2].Value.ToUpper()
          $cfg = [regex]::Match($sln, '(?m)^\s*\{' + [regex]::Escape($m.Groups[2].Value) + '\}\.' + [regex]::Escape($solutionCfg) + '\.Build\.0 = ([^|]+)\|(\S+)\s*$')
          $deps = @([regex]::Matches($m.Groups[3].Value, '\{([0-9A-Fa-f-]+)\} = \{') | ForEach-Object { $_.Groups[1].Value.ToUpper() })
          $wix[$guid] = [pscustomobject]@{ Path = $m.Groups[1].Value; Build = $cfg.Success; Cfg = $cfg.Groups[1].Value; Plat = $cfg.Groups[2].Value; Deps = $deps }
        }
        if ($wix.Count -eq 0) { throw "No .wixproj projects found in ${{ env.SOLUTION_FILE_PATH }}" }
        # Depth-first topological order over wixproj -> wixproj dependencies (others are already built).
        $order = New-Object System.Collections.Generic.List[string]; $state = @{}
        function Visit-Project([string]$g) {
          if ($state[$g] -eq 'done') { return }
          if ($state[$g] -eq 'visiting') { throw "Dependency cycle involving $($wix[$g].Path)" }
          $state[$g] = 'visiting'
          foreach ($d in $wix[$g].Deps) { if ($wix.ContainsKey($d)) { Visit-Project $d } }
          $state[$g] = 'done'; $order.Add($g)
        }
        foreach ($g in @($wix.Keys | Sort-Object)) { Visit-Project $g }
        $built = 0
        foreach ($g in $order) {
          $p = $wix[$g]
          if (-not $p.Build) { Write-Host "Skipping $($p.Path) (not built for $solutionCfg)"; continue }
          Write-Host "Building $($p.Path) ($($p.Cfg)|$($p.Plat))"
          & $env:MSBUILD_PATH $p.Path /v:m "/p:Configuration=$($p.Cfg)" "/p:Platform=$($p.Plat)" "/p:SolutionDir=$env:GITHUB_WORKSPACE\"
          if ($LASTEXITCODE -ne 0) { throw "Building $($p.Path) failed" }
          $built++
        }
        if ($built -eq 0) { throw "No .wixproj was built for $solutionCfg - check the .sln parsing above" }

    # Fail here rather than ship an installer with unsigned files: every exe/dll the merge modules
    # just harvested from output\<platform>\<configuration>\ must still carry a valid signature.
    - name: Verify build outputs are signed
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: powershell
      run: |
        $dir = "output\${{ matrix.build_platform }}\${{ matrix.build_configuration }}"
        $bad = Get-ChildItem $dir -File | Where-Object { $_.Extension -in '.dll','.exe' } | ForEach-Object {
          $status = (Get-AuthenticodeSignature $_.FullName).Status
          if ($status -ne 'Valid') { "{0,-14} {1}" -f $status, $_.FullName }
        }
        if ($bad) {
          $bad | ForEach-Object { Write-Host "::error::$_" }
          throw "$(@($bad).Count) build output file(s) are not validly signed"
        }
        Write-Host "All build outputs are validly signed."

    # The rebuild above produced the MSI (output\<platform>\SetupSILConverters_<platform>.msi) and, in the
    # same pass, the bundle that embeds it - so the embedded MSI is unsigned. Signing the loose MSI only
    # helps if the bundle is then rebuilt from it, since the bundle's attached container is fixed at
    # compile time. Sign the MSI, then rebuild just the bundle project so it embeds the signed file.
    # (SetupSILConverters.wixproj's EnsureSignedMsiPayload target is skipped under GitHub Actions, so this
    # bundle-only build won't rebuild/recopy the MSI over the signed one.)
    - name: Sign MSI
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      uses: sillsdev/codesign/trusted-signing-action@v3
      with:
        credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
        files-folder: output/${{ matrix.build_platform }}
        files-folder-filter: msi

    - name: Rebuild bundle with signed MSI
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd
      run: >
        "%MSBUILD_PATH%"
        -t:Rebuild
        /p:Configuration=${{matrix.build_configuration}}
        /p:Platform=${{matrix.build_platform}}
        /p:SolutionDir=%GITHUB_WORKSPACE%\
        "Installer\SetupSILConverters\SetupSILConverters.wixproj"

    # Burn bundles (SetupSILConverters*.exe) carry an attached container - the vc_redist/MSI
    # payloads - appended after the engine stub at build time, with byte offsets recorded in the
    # engine's own manifest. Authenticode-signing the finished bundle exe directly changes the
    # engine's size without updating those offsets, so Burn can no longer find/extract the
    # container at install time ("Failed to acquire container: WixAttachedContainer", surfacing as
    # a "locate missing file" dialog and an 0x800704c7 abort). The fix is the same detach/sign/
    # reattach/sign dance the (legacy) TeamCity build already does for this exact reason - see
    # build/buildBaseInstaller.bat's "UseInsignia" branch, which calls insignia -ib/-ab around the
    # sign - just using the modern `wix burn detach`/`reattach` subcommands instead of insignia.exe.
    - name: Install WiX signing tool
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd
      run: |
        dotnet tool install --global wix --version 6.0.2
        echo %USERPROFILE%\.dotnet\tools>> %GITHUB_PATH%

    - name: Detach bundle engine for signing
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd
      run: >
        for %%f in ("output\${{matrix.build_platform}}\SetupSILConverters*.exe")
        do wix burn detach "%%f" -engine "output\${{matrix.build_platform}}\engine.exe"

    - name: Sign bundle engine
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      uses: sillsdev/codesign/trusted-signing-action@v3
      with:
        credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
        files-folder: output/${{ matrix.build_platform }}
        files-folder-filter: engine.exe

    - name: Reattach signed engine to bundle
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      shell: cmd
      run: |
        for %%f in ("output\${{matrix.build_platform}}\SetupSILConverters*.exe") do wix burn reattach "%%f" -engine "output\${{matrix.build_platform}}\engine.exe" -o "%%f"
        del "output\${{matrix.build_platform}}\engine.exe"

    - name: Sign installer
      if: ${{ matrix.build_configuration == 'Release' && github.event_name != 'pull_request' }}
      uses: sillsdev/codesign/trusted-signing-action@v3
      with:
        credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
        files-folder: output/${{ matrix.build_platform }}
        files-folder-filter: SetupSILConverters*.exe

    - name: Upload installer artifact
      if: ${{ matrix.build_configuration == 'Release' }}
      uses: actions/upload-artifact@v6
      with:
        name: silconverters-installer-${{ matrix.build_platform }}
        if-no-files-found: error
        path: output/${{ matrix.build_platform }}/SetupSILConverters*.exe
